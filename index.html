<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODOFORMA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:    #0C0C0B;
  --fg:    #F5F3EE;
  --rust:  #C4480A;
  --rule:  rgba(245,243,238,0.1);
  --muted: rgba(245,243,238,0.38);
  --col:   80px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 17px;
  line-height: 1.6;
  overflow-x: hidden;
  cursor: none;
}

/* ── CURSOR ── */
.cur {
  position: fixed; width: 5px; height: 5px;
  background: var(--fg); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  transition: width .2s, height .2s, background .2s;
}
.cur.hover {
  width: 28px; height: 28px;
  background: transparent;
  border: 1px solid var(--fg);
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 var(--col);
  height: 64px;
  border-bottom: 1px solid var(--rule);
  background: rgba(12,12,11,0.94);
  backdrop-filter: blur(10px);
}
.nav-logo { display: block; line-height: 0; text-decoration: none; }
.nav-logo svg { height: 22px; width: auto; display: block; }
.nav-links { display: flex; gap: 36px; list-style: none; }
.nav-links a {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); text-decoration: none; transition: color .15s;
}
.nav-links a:hover { color: var(--fg); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--col) 1fr var(--col);
  border-bottom: 1px solid var(--rule);
}
.hero-inner {
  grid-column: 2;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 80px 0 100px;
  padding-top: calc(64px + 32px);
}
.hero-kicker {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--rust);
  margin-bottom: 40px;
  opacity: 0; animation: up .7s .1s forwards;
}
.hero-mark {
  position: relative;
  opacity: 0;
  animation: smokeIn 3.2s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
}
.hero-mark svg { width: 100%; max-width: 680px; height: auto; display: block; }

/* Drifting smoke wisps above the logo */
.hero-mark::before,
.hero-mark::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
}
.hero-mark::before {
  width: 340px; height: 120px;
  top: -30px; left: 8%;
  background: radial-gradient(ellipse, rgba(245,243,238,0.09) 0%, transparent 70%);
  filter: blur(22px);
  animation: wispA 4s 0.6s ease-out forwards;
}
.hero-mark::after {
  width: 260px; height: 90px;
  top: -20px; left: 38%;
  background: radial-gradient(ellipse, rgba(245,243,238,0.07) 0%, transparent 70%);
  filter: blur(18px);
  animation: wispB 3.6s 1s ease-out forwards;
}
.hero-body {
  margin-top: 48px;
  display: grid; grid-template-columns: 1fr; gap: 40px;
  padding-top: 40px; border-top: 1px solid var(--rule);
  opacity: 0; animation: up .7s .55s forwards;
}
.hero-tagline {
  font-size: clamp(22px,2.4vw,30px); font-weight: 300; font-style: italic;
  line-height: 1.35; color: var(--fg); max-width: 420px;
  padding: 32px 0;
}

/* ── BRAND LOGOS ── */
.hero-brands {
  display: flex; align-items: center; gap: 40px;
  padding-top: 32px;
  border-top: 1px solid var(--rule);
  flex-wrap: nowrap; overflow-x: auto;
}
.brand-logo {
  opacity: 0.45; transition: opacity .2s;
  flex: 0 0 auto; display: block; text-decoration: none;
}
.brand-logo:hover { opacity: 1; }
.brand-logo svg { height: 140px; width: auto; display: block; }
.hero-right-col {
  display: flex; flex-direction: column;
  justify-content: flex-end; align-items: flex-end; gap: 24px;
}
.hero-desc {
  font-family: 'DM Mono', monospace; font-size: 11px; line-height: 1.8;
  color: var(--muted); text-align: right; max-width: 280px;
}

/* ── BUTTONS ── */
.btn {
  display: inline-block; font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  text-decoration: none; padding: 14px 28px;
  border: 1px solid rgba(245,243,238,0.3); color: var(--fg);
  position: relative; overflow: hidden; transition: color .3s;
}
.btn::before {
  content: ''; position: absolute; inset: 0; background: var(--fg);
  transform: translateY(101%);
  transition: transform .3s cubic-bezier(.76,0,.24,1);
}
.btn:hover { color: var(--bg); }
.btn:hover::before { transform: translateY(0); }
.btn span { position: relative; z-index: 1; }

.btn-ghost-link {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; transition: color .2s;
}
.btn-ghost-link:hover { color: var(--fg); }
.btn-ghost-link svg { transition: transform .2s; }
.btn-ghost-link:hover svg { transform: translateX(4px); }

/* ── SECTION GRID ── */
.section {
  display: grid;
  grid-template-columns: var(--col) 1fr var(--col);
  border-bottom: 1px solid var(--rule);
}
.section-inner { grid-column: 2; padding: 100px 0; }

/* ── SECTION LABEL ── */
.label {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--rust);
  margin-bottom: 60px; display: flex; align-items: center; gap: 16px;
}
.label::before { content: ''; display: block; width: 24px; height: 1px; background: var(--rust); }

/* ── ABOUT ── */
.about-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; align-items: start; }
.about-heading {
  font-size: clamp(36px,4vw,56px); font-weight: 300; line-height: 1.1;
  letter-spacing: -0.01em;
}
.about-heading em { font-style: italic; color: var(--rust); }
.about-copy { font-size: 17px; line-height: 1.8; color: var(--muted); margin-bottom: 20px; }
.stats { display: flex; gap: 0; margin-top: 56px; border-top: 1px solid var(--rule); }
.stat { padding: 32px 40px 0 0; border-right: 1px solid var(--rule); margin-right: 40px; }
.stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.stat-n { font-size: 44px; font-weight: 300; line-height: 1; }
.stat-n sup { font-size: 20px; color: var(--rust); }
.stat-l { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }

/* ── SERVICES ── */
.services-list {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  border-top: 1px solid var(--rule);
}
.svc {
  padding: 52px 40px 52px 0;
  border-right: 1px solid var(--rule);
}
.svc:first-child { padding-left: 0; }
.svc:not(:first-child) { padding-left: 40px; }
.svc:last-child { border-right: none; padding-right: 0; }
.svc-n { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 24px; }
.svc-name { font-size: 26px; font-weight: 300; margin-bottom: 16px; line-height: 1.15; }
.svc-desc { font-size: 15px; line-height: 1.75; color: var(--muted); font-style: italic; }
.svc-link {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 28px;
  font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .2s;
}
.svc-link:hover { color: var(--fg); }
.svc-link span { display: inline-block; transition: transform .2s; }
.svc-link:hover span { transform: translateX(4px); }

/* ── WORK ── */
.work-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 56px;
}
.work-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 1px; background: var(--rule);
}
.work-item {
  background: var(--bg);
  aspect-ratio: 3/4;
  position: relative; overflow: hidden;
  display: flex; align-items: flex-end;
  transition: background .3s;
}
.work-item:hover { background: #161614; }
.work-item-inner {
  padding: 28px; width: 100%;
  border-top: 1px solid var(--rule);
}
.work-year { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 6px; }
.work-cat { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rust); margin-bottom: 4px; }
.work-name-text { font-size: 20px; font-weight: 300; font-style: italic; }
.work-index {
  position: absolute; top: 24px; right: 28px;
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
  color: var(--rule);
}
.work-logo {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  width: 65%; opacity: 0;
  transition: opacity .4s, transform .4s;
  pointer-events: none;
}
.work-item:hover .work-logo { opacity: 0.06; transform: translate(-50%,-55%); }

/* ── QUOTE ── */
.quote-section {
  display: grid;
  grid-template-columns: var(--col) 1fr var(--col);
  border-bottom: 1px solid var(--rule);
  background: #111110;
}
.quote-inner {
  grid-column: 2; padding: 100px 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
}
blockquote {
  font-size: clamp(28px,3.2vw,46px); font-weight: 300; font-style: italic;
  line-height: 1.25; color: var(--fg);
  border-left: 1px solid var(--rust); padding-left: 32px;
}
.quote-right { color: var(--muted); font-size: 16px; line-height: 1.8; font-style: italic; }

/* ── CTA ── */
.cta-section {
  display: grid;
  grid-template-columns: var(--col) 1fr var(--col);
  border-bottom: 1px solid var(--rule);
}
.cta-inner {
  grid-column: 2; padding: 120px 0;
  display: flex; flex-direction: column; align-items: flex-start;
}
.cta-label-mono {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--rust);
  margin-bottom: 48px; display: flex; align-items: center; gap: 16px;
}
.cta-label-mono::before { content: ''; display: block; width: 24px; height: 1px; background: var(--rust); }

/* "start here." wordmark */
.cta-wordmark { margin-bottom: 48px; width: 100%; max-width: 200px; }
.cta-wordmark svg { width: 100%; height: auto; display: block; }

.cta-sub {
  font-size: 18px; font-style: italic; color: var(--muted);
  max-width: 400px; line-height: 1.7; margin-bottom: 52px;
}

/* ── FOOTER ── */
footer {
  display: grid;
  grid-template-columns: var(--col) 1fr var(--col);
}
.footer-inner {
  grid-column: 2; height: 72px;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-logo { text-decoration: none; line-height: 0; }
.footer-logo svg { height: 18px; width: auto; display: block; }
.footer-copy { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--muted); }
.footer-links { display: flex; gap: 28px; list-style: none; }
.footer-links a {
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .15s;
}
.footer-links a:hover { color: var(--fg); }

/* ── ANIMATIONS ── */
@keyframes up {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

/* Smoke-in: logo emerges through turbulent blur */
@keyframes smokeIn {
  0%   { opacity:0;    filter:blur(32px) brightness(2) saturate(0); transform:translateY(8px) scaleX(1.02); }
  15%  { opacity:0.3;  filter:blur(18px) brightness(1.5);           transform:translateY(5px) scaleX(1.01); }
  45%  { opacity:0.75; filter:blur(7px)  brightness(1.1);           transform:translateY(2px) scaleX(1.005); }
  75%  { opacity:0.92; filter:blur(2px)  brightness(1.02);          transform:translateY(0)   scaleX(1); }
  100% { opacity:1;    filter:blur(0)    brightness(1);             transform:translateY(0)   scaleX(1); }
}

/* Smoke wisps that float up and vanish */
@keyframes wispA {
  0%   { opacity:0;    transform:translateY(0) translateX(0) scaleX(1); }
  20%  { opacity:1; }
  100% { opacity:0;    transform:translateY(-60px) translateX(20px) scaleX(1.4); }
}
@keyframes wispB {
  0%   { opacity:0;    transform:translateY(0) translateX(0) scaleX(1); }
  20%  { opacity:0.7; }
  100% { opacity:0;    transform:translateY(-50px) translateX(-15px) scaleX(1.3); }
}

.reveal { opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s ease; }
.reveal.in { opacity:1; transform:none; }

/* ── RESPONSIVE ── */
@media (max-width: 860px) {
  :root { --col: 24px; }
  .about-grid { grid-template-columns: 1fr; gap: 48px; }
  .services-list { grid-template-columns: 1fr; }
  .svc { border-right:none; border-bottom:1px solid var(--rule); padding:40px 0; }
  .svc:last-child { border-bottom:none; }
  .work-grid { grid-template-columns: 1fr 1fr; }
  .quote-inner { grid-template-columns: 1fr; gap: 40px; }
  .hero-body { grid-template-columns: 1fr; gap: 24px; }
  .hero-right-col { align-items: flex-start; }
  .hero-desc { text-align: left; }
  .hero-brands { flex-wrap: wrap; }
  nav { padding: 0 24px; }
  .nav-links { display: none; }
  .footer-inner { flex-wrap: wrap; gap: 12px; height: auto; padding: 24px 0; }
}
</style>
</head>

<!-- HERO — white logo mark -->
<section class="hero">
  <div class="hero-inner">
